name: Build NFC Pulse APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/nfc/pulse app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NFCPulse"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.nfc.pulse"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.nfc.pulse"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.NFC" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.nfc.hce" android:required="true" />

              <application
                  android:label="NFC Pulse"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NdefService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NFC_SERVICE">
                      <intent-filter>
                          <action android:name="android.nfc.cardemulation.action.HOST_APDU_SERVICE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.nfc.cardemulation.host_apdu_service"
                          android:resource="@xml/apduservice" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/apduservice.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <host-apdu-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/hce_desc"
              android:requireDeviceUnlock="false">
              <aid-group android:description="@string/hce_desc" android:category="other">
                  <aid-filter android:name="D2760000850101" />
              </aid-group>
          </host-apdu-service>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="hce_desc">NFC Pulse 13.56 MHz Tag</string>
          </resources>
          EOF

          cat > app/src/main/java/com/nfc/pulse/NdefService.kt <<'EOF'
          package com.nfc.pulse

          import android.content.Context
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.nfc.cardemulation.HostApduService
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator

          object NfcState {
              @Volatile var text: String = "Hallo von 13.56 MHz"
              @Volatile var count: Int = 0
              @Volatile var listener: (() -> Unit)? = null
              private var last = 0L

              fun hit(ctx: Context) {
                  val now = System.currentTimeMillis()
                  if (now - last < 1500) return
                  last = now
                  count++
                  try {
                      val v = ctx.getSystemService(Vibrator::class.java)
                      v?.vibrate(VibrationEffect.createOneShot(140, VibrationEffect.DEFAULT_AMPLITUDE))
                      ToneGenerator(AudioManager.STREAM_NOTIFICATION, 80)
                          .startTone(ToneGenerator.TONE_PROP_ACK, 160)
                  } catch (_: Exception) {}
                  Handler(Looper.getMainLooper()).post { listener?.invoke() }
              }
          }

          class NdefService : HostApduService() {
              private var appSelected = false
              private var selected = 0 // 1 = CC, 2 = NDEF

              private fun b(vararg v: Int) = ByteArray(v.size) { v[it].toByte() }
              private val ok = b(0x90, 0x00)
              private val notFound = b(0x6A, 0x82)
              private val aid = b(0xD2, 0x76, 0x00, 0x00, 0x85, 0x01, 0x01)
              private val cc = b(0x00, 0x0F, 0x20, 0x00, 0x3B, 0x00, 0x34,
                  0x04, 0x06, 0xE1, 0x04, 0x00, 0xFF, 0x00, 0xFF)

              private fun ndefFile(): ByteArray {
                  val t = NfcState.text.toByteArray(Charsets.UTF_8).let { if (it.size > 200) it.copyOf(200) else it }
                  val payload = b(0x02, 'e'.code, 'n'.code) + t
                  val record = b(0xD1, 0x01, payload.size, 0x54) + payload
                  return b(record.size shr 8, record.size and 0xFF) + record
              }

              override fun processCommandApdu(a: ByteArray, extras: Bundle?): ByteArray {
                  if (a.size < 4) return b(0x6F, 0x00)
                  val ins = a[1].toInt() and 0xFF
                  if (ins == 0xA4) {
                      if (a[2].toInt() == 0x04) {
                          val len = a[4].toInt() and 0xFF
                          if (a.size >= 5 + len && a.copyOfRange(5, 5 + len).contentEquals(aid)) {
                              appSelected = true; selected = 0
                              return ok
                          }
                          return notFound
                      }
                      if (!appSelected || a.size < 7) return notFound
                      val fid = ((a[5].toInt() and 0xFF) shl 8) or (a[6].toInt() and 0xFF)
                      return when (fid) {
                          0xE103 -> { selected = 1; ok }
                          0xE104 -> { selected = 2; NfcState.hit(applicationContext); ok }
                          else -> notFound
                      }
                  }
                  if (ins == 0xB0) {
                      val data = when (selected) { 1 -> cc; 2 -> ndefFile(); else -> return notFound }
                      val off = ((a[2].toInt() and 0xFF) shl 8) or (a[3].toInt() and 0xFF)
                      var le = if (a.size > 4) a[4].toInt() and 0xFF else 0
                      if (le == 0) le = 256
                      if (off > data.size) return b(0x6B, 0x00)
                      return data.copyOfRange(off, minOf(data.size, off + le)) + ok
                  }
                  return b(0x6D, 0x00)
              }

              override fun onDeactivated(reason: Int) { appSelected = false; selected = 0 }
          }
          EOF

          cat > app/src/main/java/com/nfc/pulse/MainActivity.kt <<'EOF'
          package com.nfc.pulse

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.nfc.NfcAdapter
          import android.nfc.cardemulation.CardEmulation
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.animation.LinearInterpolator
          import android.widget.*

          class PulseView(c: Context) : View(c) {
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 7f }
              private val core = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textAlign = Paint.Align.CENTER
                  typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
              }
              private var phase = 0f
              private var boost = 0f
              var active = true
              private val loop = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 2600; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { phase = it.animatedValue as Float; invalidate() }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); loop.start() }
              override fun onDetachedFromWindow() { loop.cancel(); super.onDetachedFromWindow() }

              fun burst() {
                  ValueAnimator.ofFloat(1f, 0f).apply {
                      duration = 1000
                      addUpdateListener { boost = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }

              override fun onDraw(cv: Canvas) {
                  val cx = width / 2f; val cy = height / 2f
                  val maxR = minOf(width, height) / 2f
                  for (i in 0 until 4) {
                      val t = (phase + i / 4f) % 1f
                      val r = maxR * (0.28f + 0.72f * t)
                      val base = if (active) 150 else 40
                      val a = ((1 - t) * (base + boost * 105)).toInt().coerceIn(0, 255)
                      ring.color = Color.argb(a, (255 * t).toInt(), (229 * (1 - t)).toInt(), (255 - 55 * t).toInt())
                      ring.strokeWidth = 5f + 8f * boost
                      cv.drawCircle(cx, cy, r, ring)
                  }
                  val cr = maxR * (0.26f + 0.04f * boost)
                  core.shader = RadialGradient(cx, cy, cr, intArrayOf(0xFF00E5FF.toInt(), 0xFF7C4DFF.toInt(), 0xFFFF00C8.toInt()), null, Shader.TileMode.CLAMP)
                  cv.drawCircle(cx, cy, cr, core)
                  txt.textSize = cr * 0.62f
                  cv.drawText("NFC", cx, cy + txt.textSize * 0.35f, txt)
              }
          }

          class MainActivity : Activity() {
              private lateinit var pulse: PulseView
              private lateinit var status: TextView
              private lateinit var counter: TextView
              private lateinit var input: EditText
              private var adapter: NfcAdapter? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun pill(color: Int) = GradientDrawable().apply { cornerRadius = dp(28).toFloat(); setColor(color) }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  window.statusBarColor = 0xFF05060F.toInt()
                  window.navigationBarColor = 0xFF05060F.toInt()
                  adapter = NfcAdapter.getDefaultAdapter(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF05060F.toInt())
                      setPadding(dp(24), dp(40), dp(24), dp(24))
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  root.addView(TextView(this).apply {
                      text = "13.56 MHz"; textSize = 38f; setTextColor(0xFF00E5FF.toInt())
                      typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD); gravity = Gravity.CENTER
                      setShadowLayer(24f, 0f, 0f, 0xFF00E5FF.toInt())
                  })
                  root.addView(TextView(this).apply {
                      text = "NFC TAG EMULATION"; textSize = 13f; setTextColor(0xFFFF00C8.toInt())
                      letterSpacing = 0.3f; gravity = Gravity.CENTER
                  })
                  pulse = PulseView(this)
                  root.addView(pulse, LinearLayout.LayoutParams(-1, dp(300)).apply { topMargin = dp(16) })

                  status = TextView(this).apply { textSize = 16f; gravity = Gravity.CENTER; setTextColor(Color.WHITE) }
                  root.addView(status)
                  counter = TextView(this).apply {
                      textSize = 14f; gravity = Gravity.CENTER; setTextColor(0xFF9AA0C0.toInt())
                      typeface = Typeface.MONOSPACE; setPadding(0, dp(6), 0, dp(18))
                  }
                  root.addView(counter)

                  input = EditText(this).apply {
                      setText(NfcState.text); setTextColor(Color.WHITE); setHintTextColor(0xFF6A7090.toInt())
                      hint = "Nachricht für andere Geräte"; inputType = InputType.TYPE_CLASS_TEXT
                      background = GradientDrawable().apply {
                          cornerRadius = dp(16).toFloat(); setColor(0xFF10132A.toInt()); setStroke(dp(1), 0xFF00E5FF.toInt())
                      }
                      setPadding(dp(18), dp(14), dp(18), dp(14))
                  }
                  root.addView(input, LinearLayout.LayoutParams(-1, -2))

                  val btn = Button(this).apply {
                      text = "SENDEN / AKTUALISIEREN"; setTextColor(Color.BLACK)
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(0xFF00E5FF.toInt(), 0xFFFF00C8.toInt())).apply { cornerRadius = dp(28).toFloat() }
                      setOnClickListener {
                          NfcState.text = input.text.toString().ifBlank { "13.56 MHz" }
                          performHapticFeedback(android.view.HapticFeedbackConstants.CONFIRM)
                          pulse.burst()
                          Toast.makeText(context, "Aktiv – Gerät an anderes Gerät halten", Toast.LENGTH_SHORT).show()
                      }
                  }
                  root.addView(btn, LinearLayout.LayoutParams(-1, dp(56)).apply { topMargin = dp(14) })

                  val cfg = Button(this).apply {
                      text = "NFC-EINSTELLUNGEN"; setTextColor(0xFF00E5FF.toInt()); background = pill(0xFF10132A.toInt())
                      setOnClickListener { startActivity(Intent(Settings.ACTION_NFC_SETTINGS)) }
                  }
                  root.addView(cfg, LinearLayout.LayoutParams(-1, dp(50)).apply { topMargin = dp(10) })

                  setContentView(ScrollView(this).apply { setBackgroundColor(0xFF05060F.toInt()); addView(root) })
              }

              private fun refresh() {
                  val a = adapter
                  when {
                      a == null -> { status.text = "Kein NFC im Gerät"; status.setTextColor(0xFFFF5252.toInt()); pulse.active = false }
                      !a.isEnabled -> { status.text = "NFC ist AUS – bitte einschalten"; status.setTextColor(0xFFFFB300.toInt()); pulse.active = false }
                      else -> { status.text = "● SENDET auf 13.56 MHz"; status.setTextColor(0xFF00FF9C.toInt()); pulse.active = true }
                  }
                  counter.text = "Erkannt: ${NfcState.count}×"
              }

              override fun onResume() {
                  super.onResume()
                  adapter?.let {
                      try { CardEmulation.getInstance(it).setPreferredService(this, ComponentName(this, NdefService::class.java)) } catch (_: Exception) {}
                  }
                  NfcState.listener = { refresh(); pulse.burst() }
                  refresh()
              }

              override fun onPause() {
                  NfcState.listener = null
                  adapter?.let {
                      try { CardEmulation.getInstance(it).unsetPreferredService(this) } catch (_: Exception) {}
                  }
                  super.onPause()
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Pulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
